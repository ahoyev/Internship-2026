<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Swimmer | SwimTeamManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>SwimTeamManager</h1>
        <p>Swim Team Management Dashboard</p>
    </header>

    <main class="container form-container">
        <section class="section" aria-labelledby="form-title">
            <h2 id="form-title">Add Swimmer</h2>
            <p id="form-note">Enter swimmer details below. Swimmers and groups are saved automatically to your team data file.</p>
            <p class="form-error" role="alert" th:if="${error}" th:text="${error}"></p>

            <form th:action="@{/swimmers}" method="post" aria-describedby="form-note">
                <div class="form-field">
                    <label for="name">Swimmer name</label>
                    <input type="text" id="name" name="name" th:value="${name}" autocomplete="name" required>
                </div>

                <div class="form-field">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" th:value="${age}" min="1" max="120" step="1" required>
                </div>

                <div class="form-field">
                    <label for="group">Swim group</label>
                    <input type="text" id="group" name="group" th:value="${group}" required>
                </div>

                <div class="form-actions">
                    <button type="submit">Save Swimmer</button>
                    <a th:href="@{/}">Back to Dashboard</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
