<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swimmers | SwimTeamManager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header><h1>SwimTeamManager</h1><p>Team Swimmers</p></header>
    <main class="container">
        <section class="section">
            <h2 th:text="${mode == 'search' ? 'Search Swimmers' : (mode == 'edit' ? 'Edit Swimmers' : (mode == 'remove' ? 'Remove Swimmers' : 'Swimmers'))}">Swimmers</h2>
            <nav class="form-actions" aria-label="Page navigation">
                <a href="/">Back to Dashboard</a>
                <a class="button" href="/swimmers/new">Add Swimmer</a>
                <a href="/attendance">View / Mark Attendance</a>
            </nav>
            <p role="status" th:if="${message}" th:text="${message}"></p>
            <form th:if="${mode == 'search' or mode == 'all'}" class="form-actions swimmer-list" action="/swimmers" th:action="${mode == 'search' ? '/swimmers/search' : '/swimmers'}" method="get">
                <div class="form-field">
                    <label for="search">Search by full name (ignores capitals)</label>
                    <input id="search" name="search" type="search" th:value="${search}">
                </div>
                <button type="submit">Search</button>
                <a th:href="${mode == 'search' ? '/swimmers/search' : '/swimmers'}">Show All</a>
            </form>
            <p th:if="${swimmers.isEmpty()}" th:text="${#strings.isEmpty(#strings.trim(search)) ? 'No swimmers yet. Add a swimmer to get started.' : 'No swimmers found with that name.'}"></p>
            <div class="table-scroll swimmer-list" th:unless="${swimmers.isEmpty()}">
                <table>
                    <caption>All swimmers</caption>
                    <thead><tr><th scope="col">Name</th><th scope="col">Age</th><th scope="col">Swim group</th><th scope="col" th:if="${mode != 'search'}">Actions</th></tr></thead>
                    <tbody><tr th:each="swimmer : ${swimmers}">
                        <td th:text="${swimmer.name}"></td>
                        <td th:text="${swimmer.age}"></td>
                        <td th:text="${swimmer.group}"></td>
                        <td th:if="${mode != 'search'}"><div class="form-actions">
                            <a th:if="${mode == 'edit' or mode == 'all'}" th:href="@{/swimmers/{id}/edit(id=${swimmer.id})}" th:aria-label="|Edit ${swimmer.name}|">Edit</a>
                            <a th:if="${mode == 'remove' or mode == 'all'}" th:href="@{/swimmers/{id}/remove(id=${swimmer.id})}" th:aria-label="|Remove ${swimmer.name}|">Remove</a>
                        </div></td>
                    </tr></tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
