<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Swimmer | SwimTeamManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header><h1>SwimTeamManager</h1><p>Remove Swimmer</p></header>
    <main class="container form-container">
        <section class="section">
            <h2>Remove Swimmer?</h2>
            <p>You are about to remove <strong th:text="${swimmer.name}"></strong>.</p>
            <p th:text="|Age: ${swimmer.age} · Group: ${swimmer.group}|"></p>
            <p>This also removes all attendance records for this swimmer. This cannot be undone.</p>
            <form method="post" th:action="@{/swimmers/{id}/remove(id=${swimmer.id})}" class="form-actions">
                <button type="submit">Remove Swimmer</button>
                <a th:href="@{/swimmers}">Cancel</a>
            </form>
        </section>
    </main>
</body>
</html>
